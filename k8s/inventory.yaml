apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: pedidos-veloz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: inventory
          image: ghcr.io/SEU_USUARIO/pedidos-veloz-inventory:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "src/services/inventory/server.js"]
          ports:
            - containerPort: 3003
          env:
            - name: INVENTORY_PORT
              value: "3003"
          envFrom:
            - configMapRef:
                name: pedidos-veloz-config
            - secretRef:
                name: pedidos-veloz-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: pedidos-veloz
spec:
  selector:
    app: inventory
  ports:
    - name: http
      port: 3003
      targetPort: 3003
