apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: pedidos-veloz
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: orders
          image: ghcr.io/mendesfelipealmeida/pedidos-veloz-orders:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "src/services/orders/server.js"]
          ports:
            - containerPort: 3001
          env:
            - name: ORDERS_PORT
              value: "3001"
          envFrom:
            - configMapRef:
                name: pedidos-veloz-config
            - secretRef:
                name: pedidos-veloz-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: pedidos-veloz
spec:
  selector:
    app: orders
  ports:
    - name: http
      port: 3001
      targetPort: 3001
