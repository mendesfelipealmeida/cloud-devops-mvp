name: CI/CD Pedidos Veloz

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/pedidos-veloz

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate Docker Compose
        run: docker compose config

  publish:
    name: Publish container images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - orders
          - payments
          - inventory
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Render manifests with commit images
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cp -R k8s rendered-k8s
          sed -i "s|ghcr.io/mendesfelipealmeida/pedidos-veloz-api-gateway:1.0.0|${IMAGE_PREFIX}-api-gateway:${GITHUB_SHA}|g" rendered-k8s/api-gateway.yaml
          sed -i "s|ghcr.io/mendesfelipealmeida/pedidos-veloz-orders:1.0.0|${IMAGE_PREFIX}-orders:${GITHUB_SHA}|g" rendered-k8s/orders.yaml
          sed -i "s|ghcr.io/mendesfelipealmeida/pedidos-veloz-payments:1.0.0|${IMAGE_PREFIX}-payments:${GITHUB_SHA}|g" rendered-k8s/payments.yaml
          sed -i "s|ghcr.io/mendesfelipealmeida/pedidos-veloz-inventory:1.0.0|${IMAGE_PREFIX}-inventory:${GITHUB_SHA}|g" rendered-k8s/inventory.yaml

      - name: Apply rendered manifests
        run: kubectl apply -f rendered-k8s/
